<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Image Directional Reveal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    .track {
      display: flex;
      width: 100vw;
      height: 440px;
      overflow: hidden;
    }

    .panel {
      position: relative;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: width;
      background: #0f172a;
    }

    /* Image layer – collapsed: left‑aligned crop */
    .panel .panel-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    /* Dark overlay for text */
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(15, 23, 42, 0.9) 0%,
        rgba(15, 23, 42, 0.4) 60%,
        rgba(15, 23, 42, 0.1) 100%
      );
      pointer-events: none;
    }

    /* Content */
    .panel .content {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      z-index: 10;
      color: white;
    }
    .panel .content h3 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .panel .content p { color: #94a3b8; }

    /* Divider */
    .panel + .panel { border-left: 1px solid rgba(255,255,255,0.06); }

    /* Collapsed state – left side visible */
    .panel.collapsed .panel-image {
      transform: scale(1);
      transform-origin: left center;
    }

    /* Hover from left – image expands left‑to‑right */
    .panel.expand-left .panel-image {
      transform: scale(1.35);
      transform-origin: left center;   /* anchor left, expand to right */
    }

    /* Hover from right – image expands right‑to‑left */
    .panel.expand-right .panel-image {
      transform: scale(1.35);
      transform-origin: right center;  /* anchor right, expand to left */
    }

    /* When panel is active (width 55%) */
    .panel.active {
      width: 55% !important;
    }
  </style>
</head>
<body>
  <div class="track" id="track">
    <!-- Panel 1 -->
    <div class="panel collapsed" data-side="left" style="width: 20%;">
      <div class="panel-image" style="background-image: url('https://picsum.photos/id/1015/1200/800');"></div>
      <div class="content"><h3>Metal & Engineering</h3><p>Sheet Metal Fabrication</p></div>
    </div>
    <!-- Panel 2 -->
    <div class="panel collapsed" data-side="left" style="width: 20%;">
      <div class="panel-image" style="background-image: url('https://picsum.photos/id/1043/1200/800');"></div>
      <div class="content"><h3>Corrugations</h3><p>Corrugated Packaging</p></div>
    </div>
    <!-- Panel 3 -->
    <div class="panel collapsed" data-side="left" style="width: 20%;">
      <div class="panel-image" style="background-image: url('https://picsum.photos/id/1060/1200/800');"></div>
      <div class="content"><h3>ThermoFoam</h3><p>EPS Thermoforming</p></div>
    </div>
    <!-- Panel 4 -->
    <div class="panel collapsed" data-side="left" style="width: 20%;">
      <div class="panel-image" style="background-image: url('https://picsum.photos/id/1080/1200/800');"></div>
      <div class="content"><h3>Biopharma</h3><p>Biopharma Manufacturing</p></div>
    </div>
    <!-- Panel 5 -->
    <div class="panel collapsed" data-side="left" style="width: 20%;">
      <div class="panel-image" style="background-image: url('https://picsum.photos/id/1074/1200/800');"></div>
      <div class="content"><h3>Polymers</h3><p>Precision Polymer</p></div>
    </div>
  </div>

  <script>
    const panels = document.querySelectorAll('.panel');
    const track = document.getElementById('track');
    let activeIndex = null;

    function resetPanels() {
      panels.forEach(p => {
        p.classList.remove('active', 'expand-left', 'expand-right');
        p.classList.add('collapsed');
        p.style.width = '20%';
      });
      activeIndex = null;
    }

    panels.forEach((panel, index) => {
      panel.addEventListener('mouseenter', (e) => {
        // Determine entry side based on cursor X relative to panel center
        const rect = panel.getBoundingClientRect();
        const entryX = e.clientX - rect.left;
        const side = entryX < rect.width / 2 ? 'left' : 'right';

        // Reset all
        resetPanels();

        // Activate current
        panel.classList.remove('collapsed');
        panel.classList.add('active');
        panel.classList.add(side === 'left' ? 'expand-left' : 'expand-right');
        activeIndex = index;

        // Set widths: active 55%, others 11.25%
        const inactive = (100 - 55) / (panels.length - 1);
        panels.forEach((p, i) => {
          p.style.width = (i === index ? 55 : inactive) + '%';
        });
      });
    });

    track.addEventListener('mouseleave', resetPanels);
  </script>
</body>
</html>
